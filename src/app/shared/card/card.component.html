<div class="card card-box h-100">
  <div class="card-body">
    <div class="card-box__header">
      @if (icon) {
        <span class="card-box__icon">{{ icon }}</span>
      }
      <span class="card-box__title">{{ title }}</span>

      @if (showEdit) {
        <button
          type="button"
          class="btn btn-link btn-sm ms-auto p-0"
          (click)="onEditClick()"
        >
          Edit
        </button>
      }
    </div>

    <div class="card-box__value">{{ value }}</div>

    <ng-content />
  </div>
</div>
