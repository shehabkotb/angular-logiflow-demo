<div class="layout">
  <aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
    <div class="sidebar__brand">
      @if (collapsed()) {
        L
      } @else {
        LogiFlow
      }
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <a
          class="sidebar__link"
          [routerLink]="item.path"
          routerLinkActive="sidebar__link--active"
          [title]="item.label"
        >
          <span class="sidebar__icon">{{ item.label.charAt(0) }}</span>
          @if (!collapsed()) {
            <span class="sidebar__label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <div class="layout__main">
    <header class="header">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
      >
        &#9776;
      </button>

      <div class="header__user">
        <span class="header__name d-none d-sm-inline">{{ userName }}</span>
        <span class="header__avatar">{{ userInitials }}</span>
        <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
          Logout
        </button>
      </div>
    </header>

    <app-notification-banner />

    <main class="layout__content">
      <router-outlet />
    </main>
  </div>
</div>
